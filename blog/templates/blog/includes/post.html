{% comment %} {% load static %} {% endcomment %}

<li>
    <article class="post">
        <a href="{% url 'post-detail-page' post.slug %}">
            {% comment %} <img src="{% static 'blog/images/'|add:post.image_name %}" alt="Mountain Hiking"> {% endcomment %}
            <img src="{{post.image_name.url}}" alt="Mountain Hiking">
            <div class="post__content">
                <h3>{{ post.title }}</h3>
                <p>{{ post.excerpt}} </p>
            </div>
        </a>
    </article>
</li>
